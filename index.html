<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Lớp LHS-TTHS Ứng dụng K39 - ULAW 2025</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #2d1b69 100%);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
}

.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  background: radial-gradient(2px 2px at 20px 30px, #eee, transparent),
              radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
              radial-gradient(1px 1px at 90px 40px, #fff, transparent),
              radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
              radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
  background-size: 200px 100px;
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

header {
  position: relative; z-index: 1;
  text-align: center; padding: 40px 20px 20px;
}
header h1 {
  font-size: 2.2em; font-weight: 700;
  background: linear-gradient(90deg, #FFD700, #FF6B6B, #4ECDC4, #A18CD1);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradientShift 5s ease infinite;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
header p { color: #aaa; margin-top: 8px; font-size: 1em; }
.stats {
  display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-wrap: wrap;
}
.stat-badge {
  background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
  padding: 8px 18px; font-size: 0.85em;
}

.search-box {
  position: relative; z-index: 1;
  max-width: 500px; margin: 25px auto 10px; padding: 0 20px;
}
.search-box input {
  width: 100%; padding: 14px 20px 14px 45px;
  border-radius: 50px; border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
  color: #fff; font-size: 1em; font-family: 'Quicksand', sans-serif;
  outline: none; transition: all 0.3s;
}
.search-box input::placeholder { color: rgba(255,255,255,0.4); }
.search-box input:focus { border-color: #4ECDC4; background: rgba(255,255,255,0.12); }
.search-icon {
  position: absolute; left: 35px; top: 50%; transform: translateY(-50%);
  font-size: 1.2em; opacity: 0.5;
}

.container {
  position: relative; z-index: 1;
  max-width: 1200px; margin: 0 auto; padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.card {
  background: rgba(255,255,255,0.07); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 20px; text-align: center;
  cursor: pointer; transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.card:hover {
  transform: translateY(-5px);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.card .avatar {
  width: 70px; height: 70px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 1.6em; font-weight: 700;
  color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.card .name { font-weight: 700; font-size: 1em; margin-bottom: 4px; }
.card .mshv { font-size: 0.75em; color: rgba(255,255,255,0.5); }
.card .badge {
  display: inline-block; margin-top: 8px; padding: 3px 10px;
  border-radius: 10px; font-size: 0.7em; font-weight: 600;
}
.badge-nam { background: rgba(78,205,196,0.2); color: #4ECDC4; }
.badge-nu { background: rgba(250,112,154,0.2); color: #FA709A; }

/* Modal / Detail View */
.overlay {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; z-index: 100;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
  justify-content: center; align-items: center;
}
.overlay.active { display: flex; }
.detail {
  background: linear-gradient(145deg, #1e1e3f, #2a2a5a);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px; padding: 40px; max-width: 550px; width: 90%;
  position: relative; animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.detail .close-btn {
  position: absolute; top: 15px; right: 20px;
  font-size: 1.5em; cursor: pointer; opacity: 0.6;
  transition: opacity 0.2s;
}
.detail .close-btn:hover { opacity: 1; }
.detail .avatar-lg {
  width: 100px; height: 100px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px; font-size: 2.5em; font-weight: 700;
  color: #fff;
}
.detail h2 { text-align: center; font-size: 1.5em; margin-bottom: 5px; }
.detail .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85em; margin-bottom: 20px; }
.info-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.info-item {
  background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px;
}
.info-item.full { grid-column: 1 / -1; }
.info-label { font-size: 0.7em; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.info-value { font-size: 0.95em; font-weight: 600; word-break: break-all; }
.info-value a { color: #4ECDC4; text-decoration: none; }
.info-value a:hover { text-decoration: underline; }

.back-link {
  display: block; text-align: center; margin-top: 20px;
  color: rgba(255,255,255,0.4); font-size: 0.8em;
  cursor: pointer; transition: color 0.2s;
}
.back-link:hover { color: #fff; }

footer {
  position: relative; z-index: 1;
  text-align: center; padding: 40px 20px;
  color: rgba(255,255,255,0.3); font-size: 0.8em;
}
</style>
</head>

const colors = [["#FF6B6B", "#FFE66D"], ["#4ECDC4", "#556270"], ["#FC5C7D", "#6A82FB"], ["#43E97B", "#38F9D7"], ["#FA709A", "#FEE140"], ["#A18CD1", "#FBC2EB"], ["#FDDB92", "#D1FDFF"], ["#F6D365", "#FDA085"], ["#84FAB0", "#8FD3F4"], ["#CFD9DF", "#E2EBF0"], ["#667EEA", "#764BA2"], ["#FFECD2", "#FCB69F"], ["#FF9A9E", "#FECFEF"], ["#A1C4FD", "#C2E9FB"], ["#D4FC79", "#96E6A1"], ["#FDFC47", "#24FE41"], ["#89F7FE", "#66A6FF"], ["#FDDB92", "#D1FDFF"], ["#A6C0FE", "#F68084"], ["#FCCB90", "#D57EEB"], ["#E0C3FC", "#8EC5FC"], ["#F093FB", "#F5576C"], ["#4FACFE", "#00F2FE"], ["#43E97B", "#38F9D7"]];
const emojis_m = ["\ud83d\ude0e", "\ud83e\uddd1\u200d\ud83d\udcbc", "\ud83e\udd13", "\ud83d\udc68\u200d\u2696\ufe0f", "\ud83e\uddd1\u200d\ud83c\udf93", "\ud83d\udcaa", "\ud83c\udfc3\u200d\u2642\ufe0f", "\ud83c\udfaf"];
const emojis_f = ["\ud83d\udc69\u200d\ud83d\udcbc", "\ud83d\udc83", "\ud83c\udf38", "\ud83d\udc69\u200d\u2696\ufe0f", "\ud83d\udc69\u200d\ud83c\udf93", "\u2728", "\ud83c\udf3a", "\ud83c\udf80"];

function getInitials(name) {
  const parts = name.split(' ');
  if (parts.length >= 2) return parts[parts.length-2][0] + parts[parts.length-1][0];
  return name[0];
}

function getEmoji(gt, i) {
  return gt === 'Nam' ? emojis_m[i % emojis_m.length] : emojis_f[i % emojis_f.length];
}

function getColor(i) {
  const c = colors[i % colors.length];
  return `linear-gradient(135deg, ${c[0]}, ${c[1]})`;
}

function renderGrid(list) {
  const grid = document.getElementById('studentGrid');
  grid.innerHTML = '';
  list.forEach((s, i) => {
    const idx = students.indexOf(s);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = s.mshv;
    card.onclick = () => showDetail(s.mshv);
    const badgeClass = s.gt === 'Nam' ? 'badge-nam' : 'badge-nu';
    card.innerHTML = `
      <div class="avatar" style="background:${getColor(idx)}">${getEmoji(s.gt, idx)}</div>
      <div class="name">${s.ho_ten}</div>
      <div class="mshv">${s.mshv}</div>
      <span class="badge ${badgeClass}">${s.gt}</span>
    `;
    grid.appendChild(card);
  });
}

function showDetail(mshv) {
  const s = students.find(x => x.mshv === mshv);
  if (!s) return;
  const idx = students.indexOf(s);
  const panel = document.getElementById('detailPanel');
  
  let phoneHtml = s.sdt ? `<a href="tel:${s.sdt}">${s.sdt.replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3')}</a>` : '<span style="opacity:0.3">Chưa cập nhật</span>';
  let emailHtml = s.email ? `<a href="mailto:${s.email}">${s.email}</a>` : '<span style="opacity:0.3">Chưa cập nhật</span>';
  let toHtml = s.to ? `Tổ ${s.to}` : '<span style="opacity:0.3">—</span>';
  
  panel.innerHTML = `
    <div class="close-btn" onclick="closeDetail()">✕</div>
    <div class="avatar-lg" style="background:${getColor(idx)}">${getEmoji(s.gt, idx)}</div>
    <h2>${s.ho_ten}</h2>
    <div class="subtitle">${s.mshv} · ${s.ma_hs}</div>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">📅 Ngày sinh</div>
        <div class="info-value">${s.ns}</div>
      </div>
      <div class="info-item">
        <div class="info-label">${s.gt === 'Nam' ? '👨' : '👩'} Giới tính</div>
        <div class="info-value">${s.gt}</div>
      </div>
      <div class="info-item">
        <div class="info-label">📞 Điện thoại</div>
        <div class="info-value">${phoneHtml}</div>
      </div>
      <div class="info-item">
        <div class="info-label">👥 Tổ</div>
        <div class="info-value">${toHtml}</div>
      </div>
      <div class="info-item full">
        <div class="info-label">📧 Email</div>
        <div class="info-value">${emailHtml}</div>
      </div>
      <div class="info-item full">
        <div class="info-label">📚 Ngành đào tạo</div>
        <div class="info-value">${s.nganh}</div>
      </div>
      <div class="info-item">
        <div class="info-label">🎯 Định hướng</div>
        <div class="info-value">${s.dinh_huong}</div>
      </div>
      <div class="info-item">
        <div class="info-label">🏫 Mã hồ sơ</div>
        <div class="info-value">${s.ma_hs}</div>
      </div>
    </div>
    <div class="back-link" onclick="closeDetail()">← Quay về danh sách</div>
  `;
  document.getElementById('overlay').classList.add('active');
  history.pushState(null, '', '#' + mshv);
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('active');
  history.pushState(null, '', window.location.pathname);
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { renderGrid(students); return; }
  const filtered = students.filter(s =>
    s.ho_ten.toLowerCase().includes(q) ||
    s.mshv.includes(q) ||
    s.sdt.includes(q) ||
    s.email.toLowerCase().includes(q) ||
    s.ma_hs.toLowerCase().includes(q)
  );
  renderGrid(filtered);
}

// Handle hash navigation
window.addEventListener('hashchange', () => {
  const h = window.location.hash.slice(1);
  if (h) showDetail(h); else closeDetail();
});

// Init
renderGrid(students);
if (window.location.hash) {
  const h = window.location.hash.slice(1);
  if (h) showDetail(h);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});
</script>
